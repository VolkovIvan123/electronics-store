{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Style</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Helvetica, Arial, sans-serif;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .pin-card {
            width: 300px;
            background-color: black;
            border: 1px solid yellow;
            border-radius: 20px;
            padding: 20px;
            display: inline-block;
            vertical-align: top;
        }

        .pin-card img {
            width: 100%;
            border-radius: 20px;
            display: block;
        }

        .pin-card .title {
            padding: 10px 0;
            font-size: 16px;
        }

        .save-button {
            background-color: red;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
        }

        .save-button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pin-card">
            <img src="{% static 'images/phone.jpg' %}" alt="Смартфон">
            <div class="title">Смартфон</div>
            <button class="save-button">Сохранить</button>
        </div>

        <div class="pin-card">
            <img src="{% static 'images/tablet.jpg' %}" alt="Планшет">
            <div class="title">Планшет</div>
            <button class="save-button">Сохранить</button>
        </div>

        <div class="pin-card">
            <img src="{% static 'images/smartwatch.jpg' %}" alt="Умные часы">
            <div class="title">Умные часы</div>
            <button class="save-button">Сохранить</button>
        </div>
    </div>
</body>
</html>
